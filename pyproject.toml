[project]
name = "ole5-agent"
version = "2.0.0"
description = "OLE5 support agent — reads OTRS tickets, drafts a decision, waits for human approval"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "psycopg[binary,pool]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "groq>=0.9",
    "langchain>=1.0",
    "langchain-groq>=1.0",
    "langgraph>=0.2",
    "yoyo-migrations>=8.2",
    "bcrypt>=4.1",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ole5.web" = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"